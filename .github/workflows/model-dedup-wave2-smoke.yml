name: Model Dedup Wave 2A Smoke

on:
  pull_request:
    paths:
      - "scripts/model_dedup_wave2.py"
      - "tests/test_model_dedup_wave2.py"
      - "RUN_MODEL_DEDUP_WAVE2_PLAN.cmd"
      - "RUN_MODEL_DEDUP_WAVE2_VERIFY.cmd"
      - ".github/workflows/model-dedup-wave2-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Wave 2A code
        run: python -m py_compile scripts/model_dedup_wave1.py scripts/model_dedup_wave2.py tests/test_model_dedup_wave2.py
      - name: Run Wave 2A regression tests
        run: python tests/test_model_dedup_wave2.py -v
