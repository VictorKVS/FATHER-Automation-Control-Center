name: ALINA Control Center M1

on:
  push:
    branches:
      - main
      - feature/father-knowledge-formation-standard-v01
    paths:
      - "apps/alina-control-center/**"
      - ".github/workflows/alina-control-center-m1.yml"
  pull_request:
    paths:
      - "apps/alina-control-center/**"
      - ".github/workflows/alina-control-center-m1.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/alina-control-center/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
