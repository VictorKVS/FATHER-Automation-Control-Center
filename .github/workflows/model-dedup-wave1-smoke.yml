name: Model Dedup Wave 1 Smoke

on:
  pull_request:
    paths:
      - "scripts/model_dedup_wave1.py"
      - "tests/test_model_dedup_wave1.py"
      - "RUN_MODEL_DEDUP_WAVE1_PLAN.cmd"
      - "RUN_MODEL_DEDUP_WAVE1_VERIFY.cmd"
      - ".github/workflows/model-dedup-wave1-smoke.yml"
  push:
    branches: [main]
    paths:
      - "scripts/model_dedup_wave1.py"
      - "tests/test_model_dedup_wave1.py"
      - ".github/workflows/model-dedup-wave1-smoke.yml"

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Wave 1 code
        shell: pwsh
        run: |
          python -m py_compile scripts/model_dedup_wave1.py
          python -m py_compile tests/test_model_dedup_wave1.py
      - name: Import safety constants
        shell: pwsh
        run: |
          python -c "from scripts.model_dedup_wave1 import PROTECTED_TARGET_PREFIXES; assert 'C:\\' in PROTECTED_TARGET_PREFIXES; print('wave1_import_ok')"
