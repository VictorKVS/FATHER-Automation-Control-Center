name: Validate automation registry

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild reports
        run: |
          python scripts/build_dashboard.py
          python scripts/estimate_capacity.py
      - name: Verify generated reports are current
        run: git diff --exit-code -- reports/
      - name: Run registry tests
        run: python -m unittest discover -s tests -v
